<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#5b3fd1" />
    <title>Hors connexion · SongVault</title>
    <!-- #14 : page montrée par le service worker quand le réseau manque. Autonome : aucun script, aucun fichier externe -->
    <style>
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 1rem; box-sizing: border-box;
             font-family: system-ui, sans-serif; color: #1d1d27; background: #f7f7f9; }
      main { max-width: 26rem; background: #fff; border: 1px solid #dcdce4; border-radius: 8px; padding: 1.5rem; }
      h1 { margin-top: 0; font-size: 1.4rem; }
      p { color: #666a7a; line-height: 1.5; }
      a { display: inline-block; min-height: 44px; line-height: 44px; padding: 0 1rem; border-radius: 8px;
          background: #5b3fd1; color: #fff; text-decoration: none; }
    </style>
  </head>
  <body>
    <main>
      <h1>Pas de connexion</h1>
      <p>SongVault a besoin d'Internet pour afficher vos morceaux et les écouter. Vérifiez le Wi-Fi ou les données mobiles, puis réessayez.</p>
      <a href="/">Réessayer</a>
    </main>
  </body>
</html>
