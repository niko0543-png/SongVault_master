server {
    listen 8080;
    root /usr/share/nginx/html;

    # Au-dessus de la limite de requête de l'API (≈ 51 Mo)
    client_max_body_size 60m;

    # --- API : relayée vers le conteneur "api". AUCUN add_header ici : l'API pose déjà les siens ---
    location /api/ {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # --- Assets Vite (JS, CSS) : nom avec empreinte → cache 1 an ---
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        try_files $uri =404;
    }

    # --- Pages de l'application (index.html et routes Vue Router) ---
    location / {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; media-src 'self'; style-src 'self' 'unsafe-inline'; frame-ancestors 'none'" always;
        try_files $uri $uri/ /index.html;
    }
}