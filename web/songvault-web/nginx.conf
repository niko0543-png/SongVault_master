server {
    listen 8080;
    root /usr/share/nginx/html;

    # Au-dessus de la limite de requête de l'API (≈ 51 Mo) : sinon nginx répond 413 avant même l'API
    client_max_body_size 60m;

    # --- API : relayée vers le conteneur "api" (nom du service Compose) ---
    location /api/ {
        proxy_pass http://api:8080;          # sans "/" final : l'URL /api/... est transmise telle quelle
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;             # uploads volumineux
    }

    # --- Assets Vite : nom avec empreinte → contenu immuable → cache 1 an ---
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # --- Tout le reste : fichier s'il existe, sinon index.html (routes Vue Router) ---
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}