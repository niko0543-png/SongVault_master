# Modèle : au démarrage, l'image nginx remplace ${API_UPSTREAM} et ${STORAGE_ORIGIN} (envsubst).
# Seules les variables d'environnement définies sont remplacées : $host, $scheme… restent des variables nginx.
# Valeurs par défaut dans le Dockerfile ; Azure les remplace (infra/main.bicep).

# Sur Azure, le HTTPS s'arrête avant nginx : on transmet le protocole d'origine à l'API (cookie Secure)
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

server {
    listen 8080;
    root /usr/share/nginx/html;

    # Envoi direct en stockage local : jusqu'à 2 Go à travers l'API (ADR 0012)
    client_max_body_size 2100m;

    # --- API : relayée vers le conteneur "api". AUCUN add_header ici : l'API pose déjà les siens ---
    location /api/ {
        proxy_pass ${API_UPSTREAM};
        proxy_http_version 1.1;
        # Host de l'API : Container Apps aiguille les appels internes d'après lui. L'hôte public suit dans X-Forwarded-Host.
        proxy_set_header Host              $proxy_host;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_read_timeout 120s;
        proxy_request_buffering off;    # le fichier va à l'API au fil de l'eau, sans copie sur le disque de nginx
        proxy_send_timeout 3600s;
    }

    # --- Assets Vite (JS, CSS) : nom avec empreinte → cache 1 an ---
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        try_files $uri =404;
    }

# --- #14 : service worker. Jamais en cache HTTP : le navigateur voit tout de suite une nouvelle version ---
    location = /sw.js {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # --- #14 : manifeste de l'application installable, avec son type exact ---
    location = /manifest.webmanifest {
        types { application/manifest+json webmanifest; }
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }
    
    # --- #28 : police musicale et banque de sons d'alphaTab (sans empreinte dans le nom) → cache 1 semaine ---
    location ~ ^/(font|soundfont)/ {
        add_header Cache-Control "public, max-age=604800";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # --- Pages de l'application (index.html et routes Vue Router) ---
    # STORAGE_ORIGIN : origine du stockage objet, que le navigateur appelle directement (envoi, lecture)
    location / {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Content-Security-Policy "default-src 'self'; connect-src 'self' ${STORAGE_ORIGIN}; img-src 'self' data: ${STORAGE_ORIGIN}; media-src 'self' ${STORAGE_ORIGIN}; style-src 'self' 'unsafe-inline'; frame-ancestors 'none'" always;
        try_files $uri $uri/ /index.html;
    }
}