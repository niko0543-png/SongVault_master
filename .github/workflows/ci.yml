name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: backend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - run: dotnet restore
      - run: dotnet build --no-restore -c Release
      - run: dotnet test --no-build -c Release --logger trx --results-directory TestResults
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: backend-test-results
          path: TestResults

  frontend:
    name: frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web/songvault-web
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: web/songvault-web/.nvmrc
          cache: npm
          cache-dependency-path: web/songvault-web/package-lock.json
      - run: npm ci
      - run: npm run lint:ci
      - run: npm run type-check
      - run: npm run test:unit -- --run
      - run: npm run build

  docker:
    name: docker
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      MSSQL_SA_PASSWORD: ci-only-not-a-secret-1A!
    steps:
      - uses: actions/checkout@v6
      - run: docker compose -f compose.yaml build
      - run: docker compose -f compose.yaml up -d
      # Test de fumée : inscription → connexion (cookie) → lecture, à travers nginx
      - run: |
          curl --fail --silent --show-error --retry 30 --retry-all-errors --retry-delay 5 \
               -H 'Content-Type: application/json' \
               -d '{"email":"ci@songvault.local","password":"Ci-Password1!"}' \
               http://localhost:8080/api/auth/register
          curl --fail --silent --show-error -c cookies.txt \
               -H 'Content-Type: application/json' \
               -d '{"email":"ci@songvault.local","password":"Ci-Password1!"}' \
               'http://localhost:8080/api/auth/login?useCookies=true'
         BAND_ID=$(curl --fail --silent --show-error -b cookies.txt http://localhost:8080/api/bands | jq -r '.[0].id')
          curl --fail --silent --show-error -b cookies.txt "http://localhost:8080/api/bands/$BAND_ID/songs"
      - if: failure()
        run: docker compose -f compose.yaml logs
      - if: always()
        run: docker compose -f compose.yaml down -v