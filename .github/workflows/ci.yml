name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: backend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - run: dotnet restore
      - run: dotnet build --no-restore -c Release
      - run: dotnet test --no-build -c Release --logger trx --results-directory TestResults
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: backend-test-results
          path: TestResults

  frontend:
    name: frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web/songvault-web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: web/songvault-web/.nvmrc
          cache: npm
          cache-dependency-path: web/songvault-web/package-lock.json
      - run: npm ci
      - run: npm run lint:ci
      - run: npm run type-check
      - run: npm run test:unit -- --run
      - run: npm run build

  docker:
    name: docker
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      MSSQL_SA_PASSWORD: ci-only-not-a-secret-1A!
    steps:
      - uses: actions/checkout@v7
      - run: docker compose -f compose.yaml build
      - run: docker compose -f compose.yaml up -d
      - run: curl --fail --silent --show-error --retry 30 --retry-all-errors --retry-delay 5 http://localhost:8080/api/songs
      - if: failure()
        run: docker compose -f compose.yaml logs
      - if: always()
        run: docker compose -f compose.yaml down -v