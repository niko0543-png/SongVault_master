name: Bug
description: Signaler un comportement incorrect
labels: [bug]
body:
  - type: textarea
    id: steps
    attributes:
      label: Étapes pour reproduire
      placeholder: "1. …\n2. …"
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Comportement attendu
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Comportement observé (messages, captures, traceId)
    validations:
      required: true